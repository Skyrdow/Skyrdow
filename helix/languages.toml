[language-server.tailwindcss-ls]
command = "tailwindcss-language-server"
args = ["--stdio"]

[[language]]
name = "html"
language-servers = [ "vscode-html-language-server", "tailwindcss-ls" ]
auto-format = true

[[language]]
name = "typescript"
language-servers = [ "typescript-language-server", "vscode-eslint-language-server", "eslint", "tailwindcss-ls" ]
formatter = { command = 'prettierd', args = [".ts"] }
auto-format = true

[[language]]
name = "javascript"
language-servers = [ "typescript-language-server" ]
formatter = { command = 'prettierd', args = [".js"] }
auto-format = true

[[language]]
name = "jsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]
formatter = { command = 'prettierd', args = [".jsx"] }
auto-format = true

[[language]]
name = "tsx"
language-servers = [ "typescript-language-server", "tailwindcss-ls" ]
formatter = { command = 'prettierd', args = [".tsx"] }
auto-format = true

[[language]]
name = "python"
language-servers = [ "pyright", "ruff" ]

[language-server.pyright.config.python.analysis]
typeCheckingMode = "basic"

[language-server.ruff]
command = "ruff"
args = ["server"]

[[language]]
name = "markdown"
comment-tokens = ["-", "+", "*", "- [ ]", ">"]


[[language]]
name = "svelte"
language-servers = [ "svelteserver", "tailwindcss-ls" ]

[[language]]
name = "cpp"
auto-format = true
formatter = { command = 'clang-format', args = ["--style=Google"] } 
